<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte Météo et Circulation</title>
    <!-- Lien vers la bibliothèque Leaflet pour la carte -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>

    <!-- Lien vers la bibliothèque pour afficher les cartes -->
    <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

    <!-- Intégration de jQuery pour simplification des appels API -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Lien pour la mise en forme CSS -->
    <style>
        #map {
            height: 500px;
        }
    </style>
</head>
<body>

    <!-- Partie Météo -->
    <div class="previsions">
        <h1>Prévisions météo</h1>
        <!-- Météo ici (comme avant) -->
        <!-- Assurez-vous de l'afficher selon les XSLT ou les méthodes que vous utilisez dans votre application -->
    </div>

    <!-- Partie Circulation et carte Leaflet -->
    <div class="circulation">
        <h2>Circulation dans le Grand Nancy</h2>
        <div id="map"></div>

        <h3>Qualité de l'air</h3>
        <p id="air-quality">Chargement...</p>

        <h3>Ajouter une adresse</h3>
        <input type="text" id="address-input" placeholder="Entrez une adresse">
        <button onclick="geocodeAddress()">Afficher sur la carte</button>
    </div>

    <script>
        // Initialisation de la carte Leaflet
        var map = L.map('map').setView([48.6844, 6.1850], 12); // Centré sur Nancy, Grand Est

        // Ajout d'un fond de carte
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Fonction pour afficher les points de difficulté de circulation
        function displayTrafficPoints() {
            // Exemple de données de circulation (vous devrez peut-être utiliser une API pour obtenir ces données en temps réel)
            var trafficData = [
                {lat: 48.6884, lon: 6.1890, description: 'Accident sur l\'A31', date: '12 Jan 2025'},
                {lat: 48.6864, lon: 6.1870, description: 'Embouteillage sur l\'avenue des Champs', date: '13 Jan 2025'}
            ];

            // Ajouter un marqueur pour chaque point de difficulté
            trafficData.forEach(function(point) {
                var popupContent = '<b>' + point.description + '</b><br/>Date: ' + point.date;
                L.marker([point.lat, point.lon])
                    .addTo(map)
                    .bindPopup(popupContent);
            });
        }

        // Fonction pour afficher la qualité de l'air
        function displayAirQuality() {
            $.get('https://api.openaq.org/v1/latest?city=Nancy', function(data) {
                if (data.results.length > 0) {
                    var airQuality = data.results[0].measurements[0];
                    var quality = airQuality.value;
                    var unit = airQuality.unit;
                    $('#air-quality').text('Qualité de l\'air: ' + quality + ' ' + unit);
                } else {
                    $('#air-quality').text('Données non disponibles');
                }
            });
        }

        // Fonction pour géocoder une adresse
        function geocodeAddress() {
            var address = $('#address-input').val();
            var geocodeAPI = 'https://nominatim.openstreetmap.org/search?format=json&q=' + address;

            $.get(geocodeAPI, function(data) {
                if (data.length > 0) {
                    var lat = data[0].lat;
                    var lon = data[0].lon;
                    map.setView([lat, lon], 13);
                    L.marker([lat, lon]).addTo(map).bindPopup('<b>' + address + '</b>').openPopup();
                } else {
                    alert('Adresse introuvable');
                }
            });
        }

        // Appel des fonctions
        displayTrafficPoints();
        displayAirQuality();
    </script>
</body>
</html>
